<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Register</title>
</head>
<body class="bg-[#1E1E1E] text-[#DEDEDE] font-minecraft">
    <nav class="absolute top-4 left-4">
        <a href="/" class="text-blue-400 hover:underline">&larr; Retour à l'accueil</a>
    </nav>
    <main>
        <h1 class="flex flex-col items-center justify-center text-center underline underline-offset-4 text-2xl mt-4">Inscription</h1>
        <form id="register-form" class="mt-16">
            <div class="m-4">
                <div class="text-center items-center ml-4">
                    <label for="username">Username :</label>
                    <input class="border border-2 p-2 m-2 max-w-1/3 bg-[#1E1E1E] focus:border-blue-400 focus:outline-none rounded" type="text" name="username" id="username" required />
                </div>
                <div class="text-center items-center ml-4 mt-2">
                    <label for="password">Password :</label>
                    <input class="border border-2 p-2 m-2 max-w-1/3 bg-[#1E1E1E] focus:border-blue-400 focus:outline-none rounded" type="password" name="password" id="password" required />
                </div>
            </div>
            
            <div class="flex flex-col items-center justify-center text-center gap-4 mt-8">
                <div>
                    <button class="border-[#DEDEDE] border-2 rounded-full m-2 px-4 py-2 hover:bg-[#DEDEDE] hover:text-[#1E1E1E] transition" type="submit">S'inscrire</button>
                </div>
                <div>
                    <a class="border-[#DEDEDE] border-2 rounded-full m-2 px-4 py-2 inline-block hover:bg-[#DEDEDE] hover:text-[#1E1E1E] transition" href="/auth/google">S'inscrire avec Google</a>
                </div>
                <div>
                    <p class="mt-4">Déjà un compte ? <a class="text-blue-400 hover:underline" href="/src/pages/login.html">Se connecter</a></p>
                </div>
            </div>
            <p class="text-center mt-4 text-red-500" id="error-msg"></p>
            <p class="text-center mt-4 text-green-500" id="success-msg"></p>
        </form>

        <script type="module" src="../js/register.js"></script>
    </main>
</body>
</html>
