<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Administration API</title>
</head>
<body class="bg-[#1E1E1E] text-[#DEDEDE] font-minecraft p-8">
    <header class="mb-8">
        <h1 class="text-3xl underline underline-offset-4 mb-4">Administration de l'API</h1>
        <nav class="mb-4"><a href="/" class="text-blue-400 hover:underline">&larr; Retour à l'accueil</a></nav>
        <p class="mb-4 text-zinc-300">Cette page est réservée aux utilisateurs ayant le rôle <strong class="text-red-400">admin</strong>.</p>
        <button id="check-auth" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded transition border border-emerald-500">Vérifier mon rôle</button>
        <span id="auth-status" class="ml-4"></span>
    </header>
    <hr class="border-zinc-700 mb-8">
    <main class="grid md:grid-cols-2 gap-8">
        <section class="border border-zinc-700 p-6 rounded-lg bg-zinc-900/50">
            <h2 class="text-xl mb-4 underline underline-offset-4 text-emerald-400">Modifier les données (POST, PUT, DELETE)</h2>
            <form id="admin-form" class="flex flex-col gap-4">
                <div class="form-group flex flex-col">
                    <label for="method" class="mb-1">Méthode HTTP :</label>
                    <select id="method" name="method" class="bg-[#1E1E1E] border border-zinc-500 p-2 rounded focus:border-blue-400 focus:outline-none">
                        <option value="POST">POST (Créer)</option>
                        <option value="PUT">PUT (Modifier)</option>
                        <option value="DELETE">DELETE (Supprimer)</option>
                    </select>
                </div>
                <div class="form-group flex flex-col">
                    <label for="route" class="mb-1">Route (ex: blocks ou blocks/1) :</label>
                    <input type="text" id="route" name="route" placeholder="blocks/1" required class="bg-[#1E1E1E] border border-zinc-500 p-2 rounded focus:border-blue-400 focus:outline-none" />
                </div>
                <div class="form-group flex flex-col" id="body-group">
                    <label for="body" class="mb-1">Corps de la requête (JSON) :</label>
                    <textarea id="body" name="body" rows="6" placeholder='{&#10;  "key_name": "1",&#10;  "name": "stone"&#10;}' class="bg-[#1E1E1E] border border-zinc-500 p-2 rounded focus:border-blue-400 focus:outline-none font-mono text-sm"></textarea>
                </div>
                <button type="submit" class="border border-[#DEDEDE] hover:bg-[#DEDEDE] hover:text-[#1E1E1E] p-2 rounded transition mt-4 font-bold">Envoyer la requête</button>
            </form>
        </section>
        <section class="border border-zinc-700 p-6 rounded-lg bg-zinc-900/50 flex flex-col">
            <h2 class="text-xl mb-4 underline underline-offset-4 text-blue-400">Réponse :</h2>
            <pre id="response-output" class="bg-black/80 p-4 rounded overflow-auto flex-grow font-mono text-sm border border-zinc-800 text-zinc-300">En attente...</pre>
        </section>
    </main>

    <script>
        // Check Authentication and Role
        document.getElementById('check-auth').addEventListener('click', async () => {
            const statusEl = document.getElementById('auth-status');
            statusEl.textContent = "Vérification...";
            try {
                const res = await fetch('/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.user && data.user.role === 'admin') {
                        statusEl.innerHTML = `<span class="text-green-500 font-bold">Connecté en tant que ${data.user.username} (Admin)</span>`;
                    } else {
                        statusEl.innerHTML = `<span class="text-orange-400 font-bold">Connecté en tant que ${data.user ? data.user.username : 'inconnu'} (${data.user ? data.user.role : 'sans rôle'}) Tu n'es pas admin.</span>`;
                    }
                } else {
                    statusEl.innerHTML = `<span class="text-red-500 font-bold">Non connecté</span>`;
                }
            } catch (err) {
                statusEl.textContent = "Erreur de connexion";
            }
        });

        // Hide body for DELETE
        document.getElementById('method').addEventListener('change', (e) => {
            const bodyGroup = document.getElementById('body-group');
            if (e.target.value === 'DELETE') {
                bodyGroup.style.display = 'none';
            } else {
                bodyGroup.style.display = 'flex';
            }
        });

        // Submit form
        document.getElementById('admin-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const method = document.getElementById('method').value;
            const route = document.getElementById('route').value;
            const bodyStr = document.getElementById('body').value;
            const responseOutput = document.getElementById('response-output');
            
            responseOutput.textContent = 'Chargement...';
            responseOutput.classList.remove('text-green-400', 'text-red-400', 'text-zinc-300');
            responseOutput.classList.add('text-zinc-400');
            
            const fetchOptions = {
                method: method,
                headers: {}
            };
            
            if (method !== 'DELETE') {
                try {
                    const parsed = JSON.parse(bodyStr);
                    fetchOptions.body = JSON.stringify(parsed);
                    fetchOptions.headers['Content-Type'] = 'application/json';
                } catch (e) {
                    responseOutput.classList.replace('text-zinc-400', 'text-red-400');
                    responseOutput.textContent = "Erreur : Le JSON fourni est invalide.\n" + e.message;
                    return;
                }
            }
            
            try {
                const url = `/api/${route.replace(/^\//, '')}`;
                const response = await fetch(url, fetchOptions);
                const data = await response.json();
                
                if (response.ok) {
                    responseOutput.classList.replace('text-zinc-400', 'text-green-400');
                } else {
                    responseOutput.classList.replace('text-zinc-400', 'text-red-400');
                }
                responseOutput.textContent = `Status: ${response.status}\n\n` + JSON.stringify(data, null, 2);
            } catch (err) {
                responseOutput.classList.replace('text-zinc-400', 'text-red-400');
                responseOutput.textContent = 'Erreur lors de la requête : ' + err.message;
            }
        });
    </script>
</body>
</html>
