<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Register</title>
</head>
<body class="text-[#DEDEDE] bg-[#1E1E1E]">
    <main>
        <form action="/register" method="POST">
            <div class="justify-items-center gap-2 py-4">
                <div class="grid grid-rows-2 gap-2 border-2 border-red-300 p-4 justify-items-center w-1/4">
                    <label class="text-center" for="username">Username :</label>
                    <input class="border-2 px-2 py-1 w-full" type="text" name="username" id="username" required />
                </div>
                <br>
                <div class="grid grid-rows-2 gap-2 border-2 border-red-300 p-4 justify-items-center w-1/4">
                    <label class="text-center" for="password">Password</label>
                    <input class="border-2 px-2 py-1 w-full" name="password" id="password" required />
                </div>
                <br>
                <div class="justify-items-center">
                    <button class="border-2 p-2 m-2 hover:border-red-300 hover:cursor-pointer" type="submit">S'inscrire</button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
