services:
    frontend:
      container_name: vite-frontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
        target: prod
      restart: always
      ports:
        - "${FRONTEND_PORT:-8081}:80"
        - "443:443"
      volumes:
        - caddy_data:/data
        - caddy_config:/config
      environment:
        - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      depends_on:
        - express-api

    express-api:
      container_name: express-api
      build:
        context: .
        dockerfile: Dockerfile
      restart: always
      ports:
        - "8080:8080"

      healthcheck:
        test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 60s

      env_file:
        - .env
      
      environment:
        - REDIS_URL=redis://:${REDIS_PASSWORD:-rootpassword}@redis:6379
        - MONGO_URL=mongodb://${MONGO_ROOT_USER:-root}:${MONGO_ROOT_PASSWORD:-rootpassword}@mongodb:27017/myapi?authSource=admin

      volumes:
        - ./db:/app/db
      depends_on:
        - redis
        - mongodb

    api-tests:
      image: postman/newman:alpine
      container_name: api-tests
      depends_on:
        express-api:
          condition: service_healthy
      volumes:
        - ./tests:/etc/newman
      command: run /etc/newman/postman_collection.json --env-var "baseUrl=http://express-api:8080"

    redis:
      image: redis:alpine
      container_name: redis-cache
      command: redis-server --requirepass ${REDIS_PASSWORD:-rootpassword} --maxmemory 128mb --maxmemory-policy allkeys-lru
      ports:
        - "127.0.0.1:6379:6379"

    mongodb:
      image: mongo:4.4
      container_name: mongodb-data
      restart: always
      command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
      environment:
        MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
        MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword}
      ports:
        - "127.0.0.1:27017:27017"
      volumes:
        - mongodb_data_v2:/data/db

volumes:
  mongodb_data_v2:
  caddy_data:
  caddy_config:
