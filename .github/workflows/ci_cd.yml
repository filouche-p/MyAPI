name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Create .env file
      run: cp .env.example .env

    - name: Start infrastructure and API (Docker Compose)
      run: |
        # Build and start MongoDB, Redis, and the API container
        # The Dockerfile automatically builds the Vite frontend
        docker compose up -d --build

    - name: Install Newman (API Testing)
      run: npm install

    - name: Wait for API to be ready
      run: |
        echo "Waiting for API to be accessible..."
        # Wait until the /health endpoint responds (up to 30 seconds)
        curl --retry 6 --retry-connrefused --retry-delay 5 -f http://localhost:8080/health || (echo "API failed to start" && docker compose logs && exit 1)

    - name: Run API Tests
      run: npm test

    - name: Tear down Docker Compose
      if: always()
      run: docker compose down
